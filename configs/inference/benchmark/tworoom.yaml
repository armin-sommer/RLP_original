# @package _global_
defaults:
  - /environment: tworoom
  - /data: tworoom
  - /core/agent/policy: random
  - /core/agent/solver: cem
  - /core/agent/value: latent
  - _self_
benchmark:
  wall_center: 112.0
  # held out: the agent trains on episodes 0-7999; episode_range=null is the LeWM/DINO-WM
  # protocol, where training and evaluation share the full pool
  episode_range: "8000:10000"
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
output:
  filename: tworoom_pixels_results.txt
