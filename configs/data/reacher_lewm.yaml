# @package data
# The public Reacher h5 pads every episode's terminal step with NaN actions.
cache_dir: null
image_size: 224
action_stats: null
train_split: 0.9
train_episodes: null  # train on episodes [0, N) only; null = all
loader:
  batch_size: 128
  num_workers: 6
  drop_last: true
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  shuffle: true
dataset:
  name: dmc/reacher_random.lance
  num_steps: 4
  frameskip: 5
  keys_to_load: [pixels, action, proprio]
  keys_to_cache: [action, proprio]
  keys_to_merge: {}
