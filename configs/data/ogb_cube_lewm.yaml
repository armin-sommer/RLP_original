# @package data
cache_dir: null
image_size: 224
action_stats: null
train_split: 0.9
train_episodes: null  # train on episodes [0, N) only; null = all
loader:
  batch_size: 128
  num_workers: 6
  drop_last: true
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
  shuffle: true
dataset:
  name: ${oc.env:RP1_DATA_HOME,${oc.env:HOME}/.cache/rp1}/datasets/ogb_cube_single.lance
  num_steps: 4
  frameskip: 5
  keys_to_load: [pixels, action, observation]
  keys_to_cache: [action, observation]
  keys_to_merge:
    proprio: proprio
