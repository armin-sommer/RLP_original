name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the vendored checkpoints the tests load
        run: git lfs pull --include "assets/core/world_model/cube_lewm/**,assets/core/agent/cube/lewm/s0/**"
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          cache: true
          environments: dev
      - run: pixi lock --check
      - run: pixi run -e dev --platform linux-64 check
      - name: Build wheel and verify installed config discovery
        run: |
          pixi run -e dev python -m pip wheel --no-deps --wheel-dir dist .
          pixi run -e dev python -m venv --system-site-packages /tmp/rp1-wheel-smoke
          /tmp/rp1-wheel-smoke/bin/pip install --no-deps dist/rp1-*.whl
          cd /tmp
          /tmp/rp1-wheel-smoke/bin/python -c "from rp1.inference.evaluate import main; from rp1.utils.config import get_config_root; assert get_config_root().is_dir()"
