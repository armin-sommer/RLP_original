[project]
name = "rp1"
version = "0.1.0"
description = "Learned iterative planning over latent world models"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Armin SOMMER" },
]

[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rp1"]

[tool.hatch.build.targets.wheel.shared-data]
"configs" = "share/rp1/configs"

[tool.hatch.build.targets.sdist]
include = [
  "/src/rp1",
  "/configs",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/pixi.toml",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PTH", "BLE", "T10", "RUF001", "RUF002", "RUF003"]
ignore = [
  "E741",  # ambiguous variable names
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
# `pixi run test -n0` puts a single failing test back in one process, where its output is readable.
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not slow", "-n", "auto"]
markers = [
    "slow: long-running tests skipped by default",
]
